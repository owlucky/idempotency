<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bouquets</title>
</head>
<body>
<h1>Bouquets</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Flower</th>
        <th>Quantity</th>
        <th>Total Cost</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bouquet : ${bouquets}">
        <td th:text="${bouquet.id}"></td>
        <td th:text="${bouquet.flower.species}"></td>
        <td th:text="${bouquet.quantity}"></td>
        <td th:text="${#numbers.formatDecimal(bouquet.flower.price * bouquet.quantity, 1, 2)}"></td>
    </tr>
    </tbody>
</table>

<h2>Create Bouquet</h2>
<form th:action="@{/bouquets}" th:object="${bouquet}" method="post">
    <label for="flower">Flower:</label>
    <select id="flower" th:field="*{flower}">
        <option th:each="flower : ${flowers}" th:value="${flower.id}" th:text="${flower.species}"></option>
    </select><br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" th:field="*{quantity}" min="1" required><br><br>

    <button type="submit">Create Bouquet</button>
</form>
</body>
</html>
